<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- Fragmentos reutilizados por todas as páginas.
     Uso:  <head th:replace="~{layout :: head('Título')}"></head> -->

<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${titulo} · YourPetHealth|">YourPetHealth</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&display=swap"
          rel="stylesheet">
    <link th:href="@{/css/app.css}" rel="stylesheet">
</head>

<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-yph mb-4">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">YourPetHealth</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu" aria-controls="menu"
                aria-expanded="false" aria-label="Abrir menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav me-auto">
                <li class="nav-item" sec:authorize="hasRole('RESPONSAVEL')">
                    <a class="nav-link" th:href="@{/app/home}">Início</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('RESPONSAVEL')">
                    <a class="nav-link" th:href="@{/app/pets}">Meus pets</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('RESPONSAVEL')">
                    <a class="nav-link" th:href="@{/app/consultas}">Consultas</a>
                </li>

                <li class="nav-item" sec:authorize="hasRole('VETERINARIO')">
                    <a class="nav-link" th:href="@{/vet/agenda}">Agenda</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('VETERINARIO')">
                    <a class="nav-link" th:href="@{/vet/pets}">Buscar pet</a>
                </li>
            </ul>

            <div class="d-flex align-items-center gap-3" sec:authorize="isAuthenticated()">
                <span class="text-white-50 small" sec:authentication="name">usuário</span>

                <!-- Logout precisa ser POST: o CSRF vai no th:action -->
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-sm btn-outline-light">Sair</button>
                </form>
            </div>
        </div>
    </div>
</nav>

<div th:fragment="mensagens">
    <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" role="alert" th:text="${erro}"></div>
</div>

<!-- Os scripts vivem aqui: toda página que inclui o footer os recebe -->
<footer th:fragment="footer" class="py-4 mt-5">
    <div class="container">
        YourPetHealth · Sistema de gestão clínica veterinária
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script th:src="@{/js/app.js}"></script>
</footer>

</body>
</html>
