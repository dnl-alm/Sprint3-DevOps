<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Meus pets')}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container">

    <div th:replace="~{layout :: mensagens}"></div>

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1 class="mb-0">Meus pets</h1>
        <a th:href="@{/app/pets/novo}" class="btn btn-primary">Cadastrar pet</a>
    </div>

    <div th:if="${#lists.isEmpty(pets)}" class="vazio">
        <p class="mb-3">Você ainda não cadastrou nenhum pet.</p>
        <a th:href="@{/app/pets/novo}" class="btn btn-primary">Cadastrar o primeiro</a>
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(pets)}">
        <div class="col-md-6" th:each="p : ${pets}">
            <div class="card h-100">
                <div class="card-body">

                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h2 class="mb-0" th:text="${p.nome}">Nome</h2>
                        <span class="status status-agendada" th:text="${p.sexo}">SEXO</span>
                    </div>

                    <p class="text-secondary mb-3">
                        <span th:text="${p.raca} ?: 'Raça não informada'">Raça</span> ·
                        <span th:text="${p.idade} + (${p.idade} == 1 ? ' ano' : ' anos')">idade</span>
                        <span th:if="${p.peso}" th:text="' · ' + ${p.peso} + ' kg'"></span>
                    </p>

                    <p class="small mb-3">
                        <span th:text="${p.totalConsultas}">0</span>
                        <span th:text="${p.totalConsultas} == 1 ? 'consulta' : 'consultas'">consultas</span>
                        <span th:if="${p.proximaConsulta}" class="text-secondary">
                            · próxima em
                            <span th:text="${#temporals.format(p.proximaConsulta, 'dd/MM ''às'' HH:mm')}">data</span>
                        </span>
                    </p>

                    <div class="d-flex gap-2 flex-wrap">
                        <a th:href="@{/app/pets/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary">Ver detalhes</a>

                        <a th:href="@{/app/pets/{id}/editar(id=${p.id})}"
                           class="btn btn-sm btn-outline-secondary">Editar</a>

                        <!-- DELETE precisa de POST para levar o token CSRF -->
                        <form th:action="@{/app/pets/{id}/remover(id=${p.id})}" method="post"
                              class="m-0"
                              th:data-nome="${p.nome}"
                              onsubmit="return confirmarRemocao(this)">
                            <button type="submit" class="btn btn-sm btn-outline-danger">Remover</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
