<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Histórico clínico')}"></head>

<body>

<nav th:replace="~{layout :: navbar}"></nav>

<main class="container">

    <nav aria-label="Você está em" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/app/pets}">Meus pets</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/app/pets/{id}(id=${pet.id})}" th:text="${pet.nome}">Pet</a>
            </li>
            <li class="breadcrumb-item active" aria-current="page">Histórico clínico</li>
        </ol>
    </nav>

    <h1 class="mb-1">Histórico clínico</h1>
    <p class="text-secondary mb-4" th:text="${pet.nome}">Pet</p>

    <div th:if="${#lists.isEmpty(historicos)}" class="vazio">
        <p class="mb-0">
            Nenhum registro ainda. O histórico é preenchido automaticamente
            quando o veterinário conclui uma consulta.
        </p>
    </div>

    <div class="list-group" th:unless="${#lists.isEmpty(historicos)}">
        <div class="list-group-item" th:each="h : ${historicos}">

            <div class="d-flex justify-content-between align-items-start gap-3 mb-2">
                <span class="status status-realizada" th:text="${h.tipo}">TIPO</span>
                <span class="small text-secondary"
                      th:text="${#temporals.format(h.data, 'dd/MM/yyyy ''às'' HH:mm')}">data</span>
            </div>

            <p class="mb-0" th:text="${h.descricao}">Descrição do atendimento</p>
        </div>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
