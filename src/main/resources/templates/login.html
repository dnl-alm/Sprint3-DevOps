<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Entrar')}"></head>

<body>

<main class="container">
    <div class="caixa-auth">

        <h1 class="mb-1">Entrar</h1>
        <p class="text-secondary mb-4">Acompanhe a saúde dos seus pets.</p>

        <div th:if="${param.erro}" class="alert alert-danger" role="alert">
            E-mail ou senha inválidos.
        </div>

        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            Você saiu da sua conta.
        </div>

        <div th:if="${sucesso}" class="alert alert-success" role="alert" th:text="${sucesso}"></div>

        <div class="card">
            <div class="card-body">

                <!-- O POST vai para o filtro do Spring Security, não para um controller.
                     Os campos precisam se chamar username e password. -->
                <form th:action="@{/login}" method="post">

                    <div class="mb-3">
                        <label for="username" class="form-label">E-mail</label>
                        <input type="email" id="username" name="username"
                               class="form-control" required autofocus
                               autocomplete="username">
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label">Senha</label>
                        <input type="password" id="password" name="password"
                               class="form-control" required
                               autocomplete="current-password">
                    </div>

                    <button type="submit" class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>

        <p class="text-center mt-4 mb-0">
            Ainda não tem conta?
            <a th:href="@{/cadastro}">Criar uma conta</a>
        </p>
    </div>
</main>

<footer th:replace="~{layout :: footer}"></footer>

</body>
</html>
