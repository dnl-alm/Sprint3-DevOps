spring.application.name=yourpethealth
server.port=8080

# Banco
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA — validate, nunca update
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# JSON
spring.jackson.default-property-inclusion=always

app.jwt.secret=${JWT_SECRET}
app.jwt.expiracao-horas=24
JWT_SECRET=${JWT_SECRET}

# Regras de agendamento
app.agendamento.antecedencia-minima-horas=2
app.agendamento.hora-abertura=8
app.agendamento.hora-fechamento=18
app.agendamento.janela-conflito-minutos=60

