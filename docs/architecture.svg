<svg viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474F"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="760" fill="#FFFFFF"/>

  <!-- Title -->
  <text x="600" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1A237E">Arquitetura da Solução — YourPetHealth</text>
  <text x="600" y="54" text-anchor="middle" font-size="12" fill="#607D8B">API REST para gestão de clínica veterinária · hospedada em Azure App Service, banco em Oracle Cloud</text>

  <!-- ===================== CLIENTES ===================== -->
  <rect x="20" y="100" width="190" height="220" rx="12" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="115" y="124" text-anchor="middle" font-size="13" font-weight="700" fill="#455A64">CLIENTES</text>
  <rect x="40" y="145" width="150" height="55" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="115" y="168" text-anchor="middle" font-size="12" fill="#0D47A1">Navegador</text>
  <text x="115" y="184" text-anchor="middle" font-size="10" fill="#1565C0">tutor / veterinário</text>
  <rect x="40" y="220" width="150" height="55" rx="8" fill="#E3F2FD" stroke="#1976D2" stroke-width="1.5"/>
  <text x="115" y="243" text-anchor="middle" font-size="12" fill="#0D47A1">App mobile</text>
  <text x="115" y="259" text-anchor="middle" font-size="10" fill="#1565C0">consumidor da API REST</text>

  <!-- ===================== GITHUB ===================== -->
  <rect x="900" y="80" width="280" height="200" rx="12" fill="#FAFAFA" stroke="#90A4AE" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1040" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#455A64">GITHUB</text>
  <rect x="920" y="120" width="240" height="55" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="1040" y="143" text-anchor="middle" font-size="12" fill="#311B92">Repositório</text>
  <text x="1040" y="159" text-anchor="middle" font-size="10" fill="#4527A0">branch main</text>
  <path d="M1040,175 L1040,198" stroke="#5E35B1" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="920" y="205" width="240" height="55" rx="8" fill="#EDE7F6" stroke="#5E35B1" stroke-width="1.5"/>
  <text x="1040" y="228" text-anchor="middle" font-size="12" fill="#311B92">GitHub Actions</text>
  <text x="1040" y="244" text-anchor="middle" font-size="10" fill="#4527A0">build Maven + deploy</text>

  <!-- ===================== ORACLE CLOUD ===================== -->
  <rect x="900" y="440" width="280" height="180" rx="12" fill="#FFF8F8" stroke="#C62828" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="1040" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#B71C1C">ORACLE CLOUD</text>
  <rect x="920" y="485" width="240" height="105" rx="8" fill="#FFEBEE" stroke="#C62828" stroke-width="1.5"/>
  <text x="1040" y="525" text-anchor="middle" font-size="13" fill="#B71C1C">Oracle Database</text>
  <text x="1040" y="543" text-anchor="middle" font-size="10" fill="#C62828">schema ****</text>
  <text x="1040" y="560" text-anchor="middle" font-size="9" fill="#D32F2F">gerenciado · externo ao Azure</text>

  <!-- ===================== AZURE ===================== -->
  <rect x="250" y="80" width="600" height="540" rx="16" fill="#F5FBFF" stroke="#0288D1" stroke-width="2"/>
  <text x="550" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="#01579B">MICROSOFT AZURE — Resource Group</text>

  <!-- App Service Plan -->
  <rect x="280" y="150" width="200" height="80" rx="8" fill="#E1F5FE" stroke="#0288D1" stroke-width="1.5"/>
  <text x="380" y="182" text-anchor="middle" font-size="12" fill="#01579B">App Service Plan</text>
  <text x="380" y="199" text-anchor="middle" font-size="10" fill="#0277BD">Linux · SKU F1</text>

  <!-- dashed "hospeda" link -->
  <path d="M480,190 L560,190" stroke="#0288D1" stroke-width="1.3" stroke-dasharray="3 3" fill="none"/>
  <text x="520" y="182" text-anchor="middle" font-size="9" fill="#546E7A">hospeda</text>

  <!-- App Service (principal) -->
  <rect x="560" y="140" width="260" height="100" rx="10" fill="#B3E5FC" stroke="#0277BD" stroke-width="2.5"/>
  <text x="690" y="178" text-anchor="middle" font-size="14" font-weight="700" fill="#01579B">Azure App Service</text>
  <text x="690" y="197" text-anchor="middle" font-size="11" fill="#01579B">Java 21 · Spring Boot</text>
  <text x="690" y="213" text-anchor="middle" font-size="10" fill="#0277BD">(Web App · HTTPS)</text>

  <!-- Application Insights -->
  <rect x="560" y="420" width="260" height="90" rx="8" fill="#E1F5FE" stroke="#0288D1" stroke-width="1.5"/>
  <text x="690" y="455" text-anchor="middle" font-size="12" font-weight="600" fill="#01579B">Application Insights</text>
  <text x="690" y="473" text-anchor="middle" font-size="10" fill="#0277BD">métricas · logs · traces</text>
  <text x="690" y="489" text-anchor="middle" font-size="9" fill="#0277BD">agente auto-instrumentado</text>

  <!-- ===================== FLUXOS (setas numeradas) ===================== -->

  <!-- 1: Cliente -> App Service -->
  <path d="M210,175 C 320,95 460,95 560,160" stroke="#37474F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="350" cy="100" r="13" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
  <text x="350" y="105" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">1</text>

  <!-- 2: GitHub Actions -> App Service -->
  <path d="M920,232 C 830,280 900,240 820,200" stroke="none" fill="none"/>
  <path d="M920,232 C 830,300 900,230 820,190" stroke="none" fill="none"/>
  <path d="M920,232 C 810,300 900,220 820,192" stroke="none" fill="none"/>
  <path d="M920,235 C 830,300 870,240 820,196" stroke="#37474F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="860" cy="270" r="13" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
  <text x="860" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">2</text>

  <!-- 3: App Service -> Oracle DB -->
  <path d="M780,240 C 880,320 900,400 940,485" stroke="#37474F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="870" cy="380" r="13" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
  <text x="870" y="385" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">3</text>

  <!-- 4: App Service -> App Insights -->
  <path d="M690,240 L690,420" stroke="#37474F" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <circle cx="690" cy="330" r="13" fill="#FFFFFF" stroke="#37474F" stroke-width="1.5"/>
  <text x="690" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#37474F">4</text>

  <!-- ===================== LEGENDA ===================== -->
  <rect x="20" y="640" width="1160" height="105" rx="10" fill="#FFFFFF" stroke="#CFD8DC" stroke-width="1.5"/>
  <text x="40" y="665" font-size="13" font-weight="700" fill="#263238">Legenda dos fluxos</text>

  <circle cx="48" cy="682" r="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.3"/>
  <text x="48" y="686" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">1</text>
  <text x="65" y="686" font-size="11" fill="#37474F">Cliente acessa a aplicação via HTTPS; endpoints /api/** exigem token JWT</text>

  <circle cx="48" cy="702" r="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.3"/>
  <text x="48" y="706" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">2</text>
  <text x="65" y="706" font-size="11" fill="#37474F">Push na branch main dispara o GitHub Actions, que publica o .jar no App Service</text>

  <circle cx="620" cy="682" r="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.3"/>
  <text x="620" y="686" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">3</text>
  <text x="637" y="686" font-size="11" fill="#37474F">Aplicação conecta ao Oracle Database via JDBC; credenciais como variável de ambiente</text>

  <circle cx="620" cy="702" r="9" fill="#FFFFFF" stroke="#37474F" stroke-width="1.3"/>
  <text x="620" y="706" text-anchor="middle" font-size="10" font-weight="700" fill="#37474F">4</text>
  <text x="637" y="706" font-size="11" fill="#37474F">Telemetria (métricas, logs, exceções) é enviada automaticamente ao Application Insights</text>

  <text x="40" y="728" font-size="10" fill="#78909C" font-style="italic">Linha tracejada: o App Service Plan define o hardware onde o App Service roda (relação estrutural, não fluxo de dados).</text>
</svg>
